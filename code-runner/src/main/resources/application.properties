# Only listens on this computer. The main app reaches it through http://localhost:8090.
server.port=${RUNNER_PORT:8090}
server.address=127.0.0.1
server.error.include-message=always

# Shared secret. The main app must send the same value in its RUNNER_TOKEN variable.
runner.token=${RUNNER_TOKEN:}

# The docker command. If Docker is not on PATH for this process, set DOCKER_CMD to the full path of docker.exe.
runner.docker-command=${DOCKER_CMD:docker}
