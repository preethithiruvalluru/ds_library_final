<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Soft crimson and gold data-science background">
  <defs>
    <radialGradient id="glowRed" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#c8141c" stop-opacity=".20"/>
      <stop offset="1" stop-color="#c8141c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGold" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f0a020" stop-opacity=".22"/>
      <stop offset="1" stop-color="#f0a020" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRose" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#e8707a" stop-opacity=".10"/>
      <stop offset="1" stop-color="#e8707a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdfc"/>
      <stop offset="1" stop-color="#fdf3f1"/>
    </linearGradient>
    <linearGradient id="wave1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f0a020" stop-opacity=".10"/>
      <stop offset="1" stop-color="#b3121f" stop-opacity=".10"/>
    </linearGradient>
    <linearGradient id="wave2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b3121f" stop-opacity=".07"/>
      <stop offset="1" stop-color="#f0a020" stop-opacity=".08"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b3121f" stop-opacity=".16"/>
      <stop offset="1" stop-color="#b3121f" stop-opacity=".03"/>
    </linearGradient>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#b3121f" opacity=".13"/>
    </pattern>
    <radialGradient id="fadeDots" cx="50%" cy="50%" r="65%">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </radialGradient>
    <mask id="dotMask"><rect width="1600" height="1000" fill="url(#fadeDots)"/></mask>
  </defs>

  <!-- warm white base -->
  <rect width="1600" height="1000" fill="url(#base)"/>

  <!-- soft colour glows -->
  <circle cx="1420" cy="90" r="560" fill="url(#glowRed)"/>
  <circle cx="130" cy="930" r="600" fill="url(#glowGold)"/>
  <circle cx="820" cy="520" r="640" fill="url(#glowRose)"/>

  <!-- dotted grid that fades toward the middle, so content stays clean -->
  <rect width="1600" height="1000" fill="url(#dots)" mask="url(#dotMask)"/>

  <!-- orbit rings, top left -->
  <g fill="none" stroke="#b3121f" stroke-opacity=".14" stroke-width="1.6">
    <circle cx="210" cy="170" r="130" stroke-dasharray="3 9"/>
    <circle cx="210" cy="170" r="210" stroke-dasharray="6 12"/>
    <circle cx="210" cy="170" r="300" stroke-opacity=".08"/>
  </g>
  <g fill="#b3121f" fill-opacity=".30">
    <circle cx="340" cy="170" r="6"/>
    <circle cx="97" cy="262" r="5"/>
    <circle cx="352" cy="318" r="4"/>
  </g>
  <circle cx="210" cy="170" r="9" fill="#f0a020" fill-opacity=".55"/>

  <!-- network graph, top right -->
  <g stroke="#b3121f" stroke-opacity=".17" stroke-width="1.6" fill="none">
    <path d="M1100 140 L1240 90 L1380 170 L1480 80"/>
    <path d="M1380 170 L1540 200 L1450 280 L1330 300 L1380 170"/>
    <path d="M1100 140 L1190 260 L1330 300 L1260 400 L1400 430 L1450 280"/>
    <path d="M1190 260 L1240 90"/>
    <path d="M1190 260 L1260 400"/>
    <path d="M1240 90 L1330 300"/>
  </g>
  <g fill="#b3121f" fill-opacity=".28">
    <circle cx="1100" cy="140" r="8"/>
    <circle cx="1240" cy="90" r="10"/>
    <circle cx="1480" cy="80" r="7"/>
    <circle cx="1540" cy="200" r="8"/>
    <circle cx="1190" cy="260" r="7"/>
    <circle cx="1330" cy="300" r="11"/>
    <circle cx="1450" cy="280" r="7"/>
    <circle cx="1260" cy="400" r="8"/>
    <circle cx="1400" cy="430" r="9"/>
  </g>
  <circle cx="1380" cy="170" r="16" fill="#f0a020" fill-opacity=".50"/>
  <circle cx="1380" cy="170" r="30" fill="none" stroke="#f0a020" stroke-opacity=".35" stroke-width="1.6"/>
  <circle cx="1330" cy="300" r="22" fill="none" stroke="#b3121f" stroke-opacity=".22" stroke-width="1.6"/>

  <!-- network graph, bottom left -->
  <g stroke="#b3121f" stroke-opacity=".15" stroke-width="1.6" fill="none">
    <path d="M120 700 L260 650 L380 740 L340 860 L200 830 L120 700"/>
    <path d="M380 740 L470 820 L340 860"/>
    <path d="M200 830 L90 900"/>
    <path d="M260 650 L200 830"/>
  </g>
  <g fill="#b3121f" fill-opacity=".26">
    <circle cx="120" cy="700" r="7"/>
    <circle cx="260" cy="650" r="9"/>
    <circle cx="380" cy="740" r="8"/>
    <circle cx="340" cy="860" r="7"/>
    <circle cx="470" cy="820" r="6"/>
    <circle cx="90" cy="900" r="6"/>
  </g>
  <circle cx="200" cy="830" r="13" fill="#f0a020" fill-opacity=".50"/>

  <!-- chart, bottom right -->
  <g>
    <rect x="1130" y="820" width="38" height="140" rx="9" fill="url(#bar)"/>
    <rect x="1190" y="770" width="38" height="190" rx="9" fill="url(#bar)"/>
    <rect x="1250" y="840" width="38" height="120" rx="9" fill="url(#bar)"/>
    <rect x="1310" y="720" width="38" height="240" rx="9" fill="url(#bar)"/>
    <rect x="1370" y="680" width="38" height="280" rx="9" fill="url(#bar)"/>
    <rect x="1430" y="740" width="38" height="220" rx="9" fill="url(#bar)"/>
  </g>
  <polyline points="1149,790 1209,740 1269,810 1329,690 1389,650 1449,710" fill="none" stroke="#f0a020" stroke-opacity=".55" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#fff" stroke="#f0a020" stroke-opacity=".7" stroke-width="3">
    <circle cx="1149" cy="790" r="6"/>
    <circle cx="1209" cy="740" r="6"/>
    <circle cx="1269" cy="810" r="6"/>
    <circle cx="1329" cy="690" r="6"/>
    <circle cx="1389" cy="650" r="6"/>
    <circle cx="1449" cy="710" r="6"/>
  </g>

  <!-- flowing waves along the bottom -->
  <path d="M0 880 C 260 800, 520 950, 820 890 S 1360 810, 1600 890 L1600 1000 L0 1000 Z" fill="url(#wave1)"/>
  <path d="M0 925 C 300 870, 560 990, 880 935 S 1380 880, 1600 940 L1600 1000 L0 1000 Z" fill="url(#wave2)"/>
</svg>
