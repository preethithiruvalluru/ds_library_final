<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Data Science Digital Library</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

  <header class="app-header">
    <div class="header-left">
      <button class="menu-toggle" id="menuToggle" aria-label="Open menu"><i class="bi bi-list"></i></button>
      <!-- Replace img/logo-placeholder.svg with the MBU logo later -->
      <img src="img/logo-placeholder.svg" alt="MBU college logo" class="brand-logo">
    </div>
    <h1 class="site-title">DATA SCIENCE DIGITAL LIBRARY<small>DS LAB &amp; STUDY PORTAL</small></h1>
    <div class="header-right gap-2">
      <button type="button" id="authBtn" class="btn btn-outline-secondary btn-sm profile-btn"></button>
      <a href="profile.html" class="btn btn-outline-primary btn-sm profile-btn">
        <i class="bi bi-person-circle"></i> <span class="label">Profile</span>
      </a>
    </div>
  </header>

  <nav class="app-sidebar" id="sidebar" aria-label="Main navigation">
    <a href="#home" class="nav-item-link" data-route="home"><i class="bi bi-house"></i> Home</a>
    <a href="#modules" class="nav-item-link" data-route="modules"><i class="bi bi-collection"></i> Modules</a>
    <a href="#notes" class="nav-item-link" data-route="notes"><i class="bi bi-journal-text"></i> Running Notes</a>
    <a href="#experiments" class="nav-item-link" data-route="experiments"><i class="bi bi-clipboard-data"></i> Lab Experiments</a>
    <a href="#tools" class="nav-item-link" data-route="tools"><i class="bi bi-tools"></i> Tools</a>
    <a href="#resources" class="nav-item-link" data-route="resources"><i class="bi bi-link-45deg"></i> Resources</a>
    <a href="#editor" class="nav-item-link" data-route="editor"><i class="bi bi-code-slash"></i> Code Editor</a>
  </nav>
  <div class="sidebar-backdrop" id="backdrop"></div>

  <main class="app-main" id="content" tabindex="-1"></main>
  <div class="toast-area" id="toasts" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/api.js"></script>
  <script src="js/pdfviewer.js"></script>
  <script src="js/sections.js"></script>
  <script src="js/home.js"></script>
  <script src="js/modules.js"></script>
  <script src="js/notes.js"></script>
  <script src="js/experiments.js"></script>
  <script src="js/tools.js"></script>
  <script src="js/resources.js"></script>
  <script src="js/editor.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
