spring.application.name=ds-library
server.port=${PORT:8085}

# MongoDB: set MONGODB_URI in your environment for Atlas; defaults to local MongoDB.
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/dslibrary?serverSelectionTimeoutMS=3000}

# File upload limits
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=30MB

# Code runner (separate service in ../code-runner). Leave empty to disable server-side running.
runner.url=${RUNNER_URL:}
runner.token=${RUNNER_TOKEN:}

# Optional GitHub token (read-only is enough) to raise the API rate limit from 60 to 5000 requests per hour.
github.token=${GITHUB_TOKEN:}

# Never show Java error details to visitors.
server.error.include-stacktrace=never
server.error.include-message=never

# Study bot: extra answer files (*.md). A file here with the same name as a bundled one REPLACES it. Leave empty to use only the bundled answers.
chat.knowledge-dir=${CHAT_KNOWLEDGE_DIR:}

# Faster page loads: compress text responses and let the browser re-use static files (it re-checks them with a quick 304)
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,application/javascript,text/javascript,application/json,image/svg+xml
server.compression.min-response-size=1024
spring.web.resources.cache.cachecontrol.no-cache=true
spring.web.resources.cache.cachecontrol.must-revalidate=true
spring.web.resources.chain.cache=true
