spring.application.name=ds-library
server.port=${PORT:8085}

# MongoDB: set MONGODB_URI in your environment for Atlas; defaults to local MongoDB.
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/dslibrary?serverSelectionTimeoutMS=3000}

# File upload limits (used from Phase 4)
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=30MB

# Admin login (only the admin can add/edit/delete). Set ADMIN_PASSWORD in your environment.
# If it is not set, a temporary random password is printed in the console at startup.
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:}
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.http-only=true

# Code runner (separate service in ../code-runner). Leave empty to disable server-side running.
runner.url=${RUNNER_URL:}
runner.token=${RUNNER_TOKEN:}

# Optional GitHub token (read-only is enough) to raise the API rate limit from 60 to 5000 requests per hour.
github.token=${GITHUB_TOKEN:}

# Production settings (all optional; safe defaults for local use)
# Set COOKIE_SECURE=true once the site is served over HTTPS so the login cookie is never sent over plain HTTP.
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.timeout=2h
# Behind a proxy such as Render or nginx set FORWARD_HEADERS=native so the real visitor address is used
# (needed for the login attempt limit to count each visitor separately).
server.forward-headers-strategy=${FORWARD_HEADERS:none}
# Never show Java error details to visitors.
server.error.include-stacktrace=never
server.error.include-message=never
