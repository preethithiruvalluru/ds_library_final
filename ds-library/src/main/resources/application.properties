spring.application.name=ds-library
server.port=${PORT:8085}

# MongoDB: set MONGODB_URI in your environment for Atlas; defaults to local MongoDB.
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/dslibrary?serverSelectionTimeoutMS=3000}

# File upload limits
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=30MB

# Code runner (separate service in ../code-runner). Leave empty to disable server-side running.
runner.url=${RUNNER_URL:}
runner.token=${RUNNER_TOKEN:}

# Optional GitHub token (read-only is enough) to raise the API rate limit from 60 to 5000 requests per hour.
github.token=${GITHUB_TOKEN:}

# Never show Java error details to visitors.
server.error.include-stacktrace=never
server.error.include-message=never

# AI study assistant (the chat window in the bottom-right corner).
# Set ANTHROPIC_API_KEY to turn it on; without a key the chat window says the assistant is not set up.
anthropic.api-key=${ANTHROPIC_API_KEY:}
# Which Claude model answers. A cheaper model (for example claude-haiku-5-5) lowers the cost.
chat.model=${CHAT_MODEL:claude-opus-5-5}
chat.max-output-tokens=${CHAT_MAX_OUTPUT_TOKENS:1500}
# There is no login, so these limits protect your credit: questions per visitor per hour, and per day for the whole site.
chat.per-visitor-per-hour=${CHAT_PER_VISITOR_PER_HOUR:30}
chat.daily-limit=${CHAT_DAILY_LIMIT:500}
# Optional: read the college information from this file instead of the built-in chat/college-info.md
chat.college-info-file=${CHAT_COLLEGE_INFO_FILE:}
