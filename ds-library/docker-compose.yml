# Runs the whole portal (app + its own MongoDB) with one command:
#   $env:ADMIN_PASSWORD = "a-long-password"
#   docker compose up --build
# Then open http://localhost:8085
#
# MongoDB is NOT published to your computer's network, only the app can reach it.
# Data is kept in the "mongo-data" volume, so it survives restarts.
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db

  app:
    build: .
    restart: unless-stopped
    depends_on:
      - mongo
    ports:
      - "8085:8085"
    environment:
      MONGODB_URI: mongodb://mongo:27017/dslibrary
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set the ADMIN_PASSWORD environment variable first}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      # Set to true when the site is served over HTTPS:
      COOKIE_SECURE: ${COOKIE_SECURE:-false}

volumes:
  mongo-data:
